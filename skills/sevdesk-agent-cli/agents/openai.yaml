display_name: "sevdesk Agent CLI"
short_description: "Sevdesk bookkeeping automation via a global CLI, with read-first discovery, account guidance, voucher intake, transaction matching, guarded booking workflows and delete-guarded mutations"
default_prompt: "Use the globally installed CLI `sevdesk-agent`. If it is missing, install it first with `npm install -g @codecell-germany/sevdesk-agent-skill`, then install the skill payload with `sevdesk-agent-skill install --force`. Start every fresh machine with `sevdesk-agent doctor --json` and `sevdesk-agent read bookkeepingSystemVersion --output json`. Prefer `find-contact`, `resolve-billing-contact`, `find-invoice --deep-scan`, `find-transaction`, `transaction find-match`, `match-transaction`, `voucher inspect`, `accounting resolve`, and `accounting resolve-tax-rule` for discovery instead of guessing raw filters. Keep PDF export in safe mode, and use `--decode-pdf --suppress-content` to avoid large base64 output. Use direct writes with preflight plus `--verify-contact` for createContact and `--verify` for supported workflows. Prefer `order edit`, `contact edit`, `invoice recreate`, `create-invoice-installment`, `invoice clone`, `create-voucher-from-pdf`, `voucher book-existing`, `expense process-paid`, `book-voucher`, and `assign-voucher-to-transaction` over improvised low-level payloads. For expense bookings against negative bank/card transactions, use `--direction expense` or a negative raw amount. For paid-expense intake, prefer `--reference-voucher-id` and `--policy gross-fallback` when a known good voucher exists. If a case looks like damage or insurance settlement, use `--policy damage-settlement` and follow the returned manual-UI escalation instead of improvising. Treat any CLI response with `ok: false` as a failed step because the CLI now exits non-zero for failed verification as well. Require explicit guard flags only for DELETE operations. Finish with a context snapshot for handoff."
