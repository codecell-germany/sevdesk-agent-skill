display_name: "sevdesk Agent CLI"
short_description: "Sevdesk bookkeeping automation via a global CLI, with read-first discovery, voucher intake, transaction matching, invoice/order/contact workflows, and delete-guarded mutations"
default_prompt: "Use the globally installed CLI `sevdesk-agent`. If it is missing, install it first with `npm install -g @codecell-germany/sevdesk-agent-skill`, then install the skill payload with `sevdesk-agent-skill install --force`. Start every fresh machine with `sevdesk-agent doctor --json` and `sevdesk-agent read bookkeepingSystemVersion --output json`. Prefer `find-contact`, `resolve-billing-contact`, `find-invoice --deep-scan`, `find-transaction`, and `match-transaction` for discovery instead of guessing raw filters. Keep PDF export in safe mode, and use `--decode-pdf --suppress-content` to avoid large base64 output. Use direct writes with preflight plus `--verify-contact` for createContact and `--verify` for supported workflows. Prefer `order edit`, `contact edit`, `invoice recreate`, `create-invoice-installment`, `invoice clone`, `create-voucher-from-pdf`, `book-voucher`, and `assign-voucher-to-transaction` over improvised low-level payloads. Require explicit guard flags only for DELETE operations. Finish with a context snapshot for handoff."
